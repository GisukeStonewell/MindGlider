name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check version and release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Select-String Cargo.toml '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag does not match Cargo.toml' }
          if (!(Test-Path "docs/releases/$($env:RELEASE_TAG).md")) { throw 'Missing release notes' }
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked --tests
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build portable ZIP and verify source and notices
        shell: pwsh
        run: ./scripts/build.ps1 -Package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
  publish-draft:
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: dist
      - name: Create draft preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG dist/*.zip dist/SHA256SUMS.txt --verify-tag --draft --prerelease --title "MindGlider $env:RELEASE_TAG (Preview)" --notes-file "docs/releases/$($env:RELEASE_TAG).md"
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; check existing release before retrying.' }
